<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon Booking</title><style>
:root{--cream:#fbf8f2;--sand:#f4eee5;--blush:#f5e7e2;--rose:#bb8584;--rose2:#d6aaa1;--ink:#332e31;--muted:#756b6c;--plum:#4a3547;--gold:#b79268;--line:#e9dfd6;--white:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#fff 0%,transparent 44%),linear-gradient(180deg,#fbf8f2,#f8f2ec);color:var(--ink);font:15px/1.65 Inter,"Segoe UI",system-ui,sans-serif}header{background:linear-gradient(120deg,#fffdf9,#f8eeea);border-bottom:1px solid #eee3dc;text-align:center;padding:38px 20px 34px;position:relative}header:after{content:"";position:absolute;bottom:-1px;left:calc(50% - 34px);width:68px;height:2px;background:var(--gold)}header h1{margin:0;color:var(--plum);font:500 clamp(28px,4vw,42px)/1.15 Georgia,serif;letter-spacing:.12em}header p{margin:10px 0 0;color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase}.wrap{max-width:1080px;margin:auto;padding:30px 22px 64px}.mode{display:flex;justify-content:center;gap:8px;margin:0 auto 28px;padding:5px;width:max-content;background:#f2eae3;border:1px solid #ece2d9;border-radius:999px}.btn{border:0;border-radius:999px;background:var(--rose);color:#fff;padding:12px 24px;font-size:14px;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;box-shadow:0 7px 18px #98696720}.btn:hover{transform:translateY(-2px);background:#a87372;box-shadow:0 10px 22px #9869672a}.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,.slot:focus-visible{outline:3px solid #c59a97;outline-offset:3px}.btn.ghost{background:transparent;color:var(--plum);border:1px solid #d9c9be;box-shadow:none}.btn.ghost:hover{background:#f8eeea}.btn.sm{padding:7px 15px;font-size:12px}.card{background:rgba(255,255,255,.92);border:1px solid #eee5dd;border-radius:20px;padding:29px;margin-bottom:20px;box-shadow:0 14px 38px #4333310c}h2{margin:0 0 17px;color:var(--plum);font:500 25px/1.3 Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.step{display:none}.step.active{display:block}.progress{display:flex;gap:7px;margin:2px 0 22px}.progress span{height:4px;flex:1;background:#efe5dd;border-radius:8px}.progress span.on{background:linear-gradient(90deg,var(--gold),var(--rose))}label{display:block;margin:12px 0 5px;color:var(--plum);font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px 13px;border:1px solid #e3d9d0;border-radius:11px;background:#fffdfa;color:var(--ink);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid #d6aaa1;border-color:transparent}.opt{background:linear-gradient(145deg,#fff,#fffaf7);border:1px solid #eee2da;border-radius:16px;padding:18px;cursor:pointer;transition:.2s}.opt:hover,.opt.sel{border-color:var(--rose2);background:#fff6f2;box-shadow:0 9px 22px #bb85841c;transform:translateY(-2px)}.opt .n{font-weight:650;color:var(--plum)}.opt .p{color:#916664;font-size:13px;margin-top:4px}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}.slot{padding:8px;text-align:center;border:1px solid #e9ddd5;border-radius:10px;background:#fff;cursor:pointer}.slot:hover,.slot.sel{background:var(--rose);border-color:var(--rose);color:white}.tag{display:inline-block;background:#f7eae5;color:#604a50;padding:3px 10px;border-radius:20px;font-size:12px;margin:3px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:8px 17px;border:1px solid #e8ddd5;background:#fff;border-radius:999px;cursor:pointer;font-size:13px;color:var(--plum);transition:.18s}.tab:hover{background:#fbf2ee}.tab.active{background:var(--plum);border-color:var(--plum);color:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #f0e8e2}th{color:var(--plum)}.status{padding:3px 10px;border-radius:20px;font-size:11px}.status.pending{background:#fff1d4;color:#76500c}.status.confirmed{background:#e2f2e7;color:#236643}.status.completed{background:#f4e9e4;color:#684c50}.status.cancelled{background:#f8e2e0;color:#873f43}.msg{padding:12px 16px;border-radius:12px;background:#e5f3e8;color:#236643}.modal{position:fixed;inset:0;background:#44333766;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}.modal .card{max-width:460px;width:100%;margin:0}@media(max-width:600px){.wrap{padding:19px 14px 42px}.card{padding:20px;border-radius:17px}header{padding:28px 15px}.grid{grid-template-columns:1fr 1fr;gap:10px}.tab{padding:7px 11px;font-size:12px}table{font-size:11px}.mode{margin-bottom:22px}}
</style></head><body><header><h1 id="bizName">Salon Booking</h1><p id="bizTag">Reserve your moment of beauty</p></header><div class="wrap"><div class="mode"><button class="btn ghost" id="btnClient">Client</button><button class="btn ghost" id="btnProvider">Provider</button></div><div id="clientView"><div class="card" id="startCard"><h2>Book an appointment</h2><div class="row"><button class="btn" id="btnStartBooking">New booking</button><button class="btn ghost" id="btnFindBooking">Find / cancel a booking</button></div></div><div id="bookingFlow" class="hidden"><div class="progress"><span class="on" id="p1"></span><span id="p2"></span><span id="p3"></span><span id="p4"></span><span id="p5"></span></div><div class="card step active" id="s1"><h2>1 · Choose a category</h2><div class="grid" id="catGrid"></div><div class="row" style="margin-top:16px"><button class="btn ghost" id="backToStart1">Back</button></div></div><div class="card step" id="s2"><h2>2 · Choose a service</h2><div class="grid" id="svcGrid"></div><div class="row" style="margin-top:16px"><button class="btn ghost" data-back="1">Back</button></div></div><div class="card step" id="s3"><h2>3 · Choose your stylist</h2><div class="grid" id="staffGrid"></div><div class="row" style="margin-top:16px"><button class="btn ghost" data-back="2">Back</button></div></div><div class="card step" id="s4"><h2>4 · Choose a date &amp; time</h2><label for="bookDate">Date</label><input id="bookDate" type="date"><div class="slots" id="slotGrid"></div><div class="row" style="margin-top:16px"><button class="btn ghost" data-back="3">Back</button></div></div><div class="card step" id="s5"><h2>5 · Your details</h2><div id="bookingSummary"></div><label for="clientName">Your name</label><input id="clientName" autocomplete="name"><label for="clientPhone">Phone</label><input id="clientPhone" type="tel" autocomplete="tel"><label for="clientEmail">Email</label><input id="clientEmail" type="email" autocomplete="email"><div class="row" style="margin-top:16px"><button class="btn ghost" data-back="4">Back</button><button class="btn" id="btnConfirmBooking">Confirm booking</button></div></div></div><div class="card hidden" id="findCard"><h2>Find / cancel a booking</h2><label for="findPhone">Phone number</label><input id="findPhone" type="tel"><button class="btn" id="btnLookup" style="margin-top:12px">Find booking</button><div id="lookupResults" style="margin-top:14px"></div></div></div><div id="providerView" class="hidden"><div class="card" id="setupCard"><h2>Salon setup</h2><div class="grid"><div><label for="setupName">Salon name</label><input id="setupName"></div><div><label for="setupTag">Tagline</label><input id="setupTag"></div><div><label for="setupCurrency">Currency</label><select id="setupCurrency"><option value="$">USD ($)</option><option value="€">EUR (€)</option><option value="£">GBP (£)</option><option value="₹">INR (₹)</option><option value="AED">AED</option></select></div></div><div class="row" style="margin-top:16px"><button class="btn" id="btnSaveSetup">Save salon details</button><button class="btn ghost" id="btnResetDemo">Reset demo data</button></div></div><div class="card"><h2>Provider dashboard</h2><div id="dashboardStats" class="grid"></div><div class="tabs" id="providerTabs"><button class="tab active" data-tab="bookings">Bookings</button><button class="tab" data-tab="services">Services</button><button class="tab" data-tab="staff">Staff</button><button class="tab" data-tab="hours">Hours</button></div><div id="providerBookings"><div class="row" style="margin-bottom:14px"><label for="filterDate" style="margin:0">Date</label><input id="filterDate" type="date" style="max-width:190px"><select id="filterStatus" style="max-width:190px"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="bookingsTable"></div></div><div id="providerServices" class="hidden"><div class="row" style="margin-bottom:14px"><button class="btn sm" id="btnAddService">Add service</button></div><div id="servicesList"></div></div><div id="providerStaff" class="hidden"><div class="row" style="margin-bottom:14px"><button class="btn sm" id="btnAddStaff">Add staff</button></div><div id="staffList"></div></div><div id="providerHours" class="hidden"><div id="hoursList"></div><button class="btn" id="btnSaveHours" style="margin-top:14px">Save hours</button></div></div></div></div><div id="modalRoot"></div><script>
const KEY='salon_booking_data_v1';const defaultData={business:{name:'Maison Belle',tag:'Reserve your moment of beauty',currency:'$'},categories:[{id:'hair',name:'Hair',emoji:'✂️'},{id:'nails',name:'Nails',emoji:'💅'},{id:'skin',name:'Skin',emoji:'✨'}],services:[{id:'cut',categoryId:'hair',name:'Signature cut & style',minutes:60,price:75},{id:'color',categoryId:'hair',name:'Color refresh',minutes:120,price:145},{id:'mani',categoryId:'nails',name:'Classic manicure',minutes:45,price:42},{id:'facial',categoryId:'skin',name:'Glow facial',minutes:60,price:95}],staff:[{id:'sophie',name:'Sophie',specialty:'Stylist'},{id:'amelia',name:'Amelia',specialty:'Colorist'}],hours:{Mon:['09:00','17:00'],Tue:['09:00','17:00'],Wed:['09:00','17:00'],Thu:['09:00','19:00'],Fri:['09:00','19:00'],Sat:['10:00','16:00'],Sun:null},bookings:[]};let db=load();let choice={category:null,service:null,staff:null,date:null,time:null};function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function uid(){return Math.random().toString(36).slice(2,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function byId(a,id){return a.find(x=>x.id===id)}function money(n){return db.business.currency+(+n).toFixed(2)}function show(id,on=true){document.getElementById(id).classList.toggle('hidden',!on)}function setMode(mode){show('clientView',mode==='client');show('providerView',mode==='provider');document.getElementById('btnClient').classList.toggle('ghost',mode!=='client');document.getElementById('btnProvider').classList.toggle('ghost',mode!=='provider');if(mode==='provider')render()}function step(n){document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i===n-1));for(let i=1;i<=5;i++)document.getElementById('p'+i).classList.toggle('on',i<=n)}function startBooking(){show('startCard',false);show('findCard',false);show('bookingFlow');choice={category:null,service:null,staff:null,date:null,time:null};step(1);renderCategories()}function renderCategories(){document.getElementById('catGrid').innerHTML=db.categories.map(c=>`<div class="opt" data-category="${esc(c.id)}"><div class="n">${esc(c.emoji)} ${esc(c.name)}</div></div>`).join('')}function renderServices(){document.getElementById('svcGrid').innerHTML=db.services.filter(s=>s.categoryId===choice.category).map(s=>`<div class="opt" data-service="${esc(s.id)}"><div class="n">${esc(s.name)}</div><div class="p">${s.minutes} min · ${money(s.price)}</div></div>`).join('')}function renderStaff(){document.getElementById('staffGrid').innerHTML=db.staff.map(s=>`<div class="opt" data-staff="${esc(s.id)}"><div class="n">${esc(s.name)}</div><div class="p">${esc(s.specialty||'Stylist')}</div></div>`).join('')}function renderSlots(){choice.date=document.getElementById('bookDate').value;let h=db.hours[['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(choice.date+'T12:00:00').getDay()]];let grid=document.getElementById('slotGrid');if(!h){grid.innerHTML='<p>Closed on this day.</p>';return}let [start,end]=h,mins=x=>{let [a,b]=x.split(':').map(Number);return a*60+b},a=mins(start),b=mins(end),used=db.bookings.filter(x=>x.date===choice.date&&x.staffId===choice.staff&&x.status!=='cancelled').map(x=>x.time);let out=[];for(let m=a;m+choice.service.minutes<=b;m+=30){let t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');if(!used.includes(t))out.push(t)}grid.innerHTML=out.length?out.map(t=>`<button class="slot" data-time="${t}">${t}</button>`).join(''):'<p>No appointments available on this date.</p>'}function renderSummary(){let s=choice.service,st=byId(db.staff,choice.staff);document.getElementById('bookingSummary').innerHTML=`<p><b>${esc(s.name)}</b> · ${esc(st?.name)} · ${choice.date} ${choice.time} · ${money(s.price)}</p>`}function render(){document.getElementById('bizName').textContent=db.business.name;document.getElementById('bizTag').textContent=db.business.tag;renderStats();renderBookings();renderServicesAdmin();renderStaffAdmin();renderHours()}function renderStats(){let today=new Date().toISOString().slice(0,10),tod=db.bookings.filter(b=>b.date===today&&b.status!=='cancelled').length,pending=db.bookings.filter(b=>b.status==='pending').length;document.getElementById('dashboardStats').innerHTML=[[db.bookings.length,'Total bookings'],[tod,'Today'],[pending,'Pending']].map(([n,l])=>`<div class="opt"><div class="n">${n}</div><div class="p">${l}</div></div>`).join('')}function renderBookings(){let d=document.getElementById('filterDate')?.value||'',status=document.getElementById('filterStatus')?.value||'all',arr=db.bookings.filter(b=>(!d||b.date===d)&&(status==='all'||b.status===status));document.getElementById('bookingsTable').innerHTML=arr.length?`<table><thead><tr><th>Date</th><th>Time</th><th>Client</th><th>Service</th><th>Staff</th><th>Status</th><th>Actions</th></tr></thead><tbody>${arr.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.time)}</td><td>${esc(b.clientName)}<br>${esc(b.clientPhone)}</td><td>${esc(byId(db.services,b.serviceId)?.name||'')}</td><td>${esc(byId(db.staff,b.staffId)?.name||'')}</td><td><span class="status ${esc(b.status)}">${esc(b.status)}</span></td><td>${b.status==='pending'?`<button class="btn sm" data-confirm="${esc(b.id)}">Confirm</button>`:''} ${b.status==='confirmed'?`<button class="btn sm" data-complete="${esc(b.id)}">Done</button>`:''} <button class="btn sm ghost" data-cancel="${esc(b.id)}">Cancel</button></td></tr>`).join('')}</tbody></table>`:'<p>No bookings found.</p>'}function renderServicesAdmin(){document.getElementById('servicesList').innerHTML=db.services.map(s=>`<div class="opt" style="margin-bottom:10px"><div class="row"><div style="flex:1"><div class="n">${esc(s.name)}</div><div class="p">${esc(byId(db.categories,s.categoryId)?.name||'')} · ${s.minutes} min · ${money(s.price)}</div></div><button class="btn sm ghost" data-editservice="${esc(s.id)}">Edit</button><button class="btn sm ghost" data-delservice="${esc(s.id)}">Delete</button></div></div>`).join('')}function renderStaffAdmin(){document.getElementById('staffList').innerHTML=db.staff.map(s=>`<div class="opt" style="margin-bottom:10px"><div class="row"><div style="flex:1"><div class="n">${esc(s.name)}</div><div class="p">${esc(s.specialty||'Stylist')}</div></div><button class="btn sm ghost" data-editstaff="${esc(s.id)}">Edit</button><button class="btn sm ghost" data-delstaff="${esc(s.id)}">Delete</button></div></div>`).join('')}function renderHours(){let labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];document.getElementById('hoursList').innerHTML=labels.map(d=>{let h=db.hours[d];return `<div class="row" style="margin:8px 0"><b style="width:48px">${d}</b><input data-hourday="${d}" type="time" value="${h?.[0]||''}" ${h?'':'disabled'}><input data-hourend="${d}" type="time" value="${h?.[1]||''}" ${h?'':'disabled'}><label style="margin:0"><input data-closed="${d}" type="checkbox" ${h?'':'checked'}> Closed</label></div>`}).join('')}function modal(title,html,onSave){let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal"><div class="card"><h2>${title}</h2>${html}<div class="row" style="margin-top:18px"><button class="btn" id="modalSave">Save</button><button class="btn ghost" id="modalClose">Close</button></div></div></div>`;document.getElementById('modalClose').onclick=()=>root.innerHTML='';document.getElementById('modalSave').onclick=()=>{onSave();root.innerHTML=''}}function editService(id){let s=id?byId(db.services,id):{name:'',categoryId:db.categories[0]?.id||'',minutes:60,price:0};modal(id?'Edit service':'Add service',`<label>Name</label><input id="mName" value="${esc(s.name)}"><label>Category</label><select id="mCategory">${db.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===s.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Duration (minutes)</label><input id="mMinutes" type="number" value="${s.minutes}"><label>Price</label><input id="mPrice" type="number" step=".01" value="${s.price}">`,()=>{Object.assign(s,{name:document.getElementById('mName').value,categoryId:document.getElementById('mCategory').value,minutes:+document.getElementById('mMinutes').value,price:+document.getElementById('mPrice').value});if(!id){s.id=uid();db.services.push(s)}save()})}function editStaff(id){let s=id?byId(db.staff,id):{name:'',specialty:''};modal(id?'Edit staff':'Add staff','<label>Name</label><input id="mName" value="'+esc(s.name)+'"><label>Specialty</label><input id="mSpecialty" value="'+esc(s.specialty)+'">',()=>{Object.assign(s,{name:document.getElementById('mName').value,specialty:document.getElementById('mSpecialty').value});if(!id){s.id=uid();db.staff.push(s)}save()})}document.addEventListener('click',e=>{let t=e.target.closest('button,.opt');if(!t)return;if(t.id==='btnClient')setMode('client');if(t.id==='btnProvider')setMode('provider');if(t.id==='btnStartBooking')startBooking();if(t.id==='btnFindBooking'){show('startCard',false);show('findCard')}if(t.id==='backToStart1'){show('bookingFlow',false);show('startCard')}if(t.dataset.back)step(+t.dataset.back);if(t.dataset.category){choice.category=t.dataset.category;renderServices();step(2)}if(t.dataset.service){choice.service=byId(db.services,t.dataset.service);renderStaff();step(3)}if(t.dataset.staff){choice.staff=t.dataset.staff;step(4);let input=document.getElementById('bookDate');let today=new Date().toISOString().slice(0,10);input.min=today;if(!input.value)input.value=today;renderSlots()}if(t.dataset.time){choice.time=t.dataset.time;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('sel',x===t));step(5);renderSummary()}if(t.id==='btnConfirmBooking'){let b={id:uid(),serviceId:choice.service.id,staffId:choice.staff,date:choice.date,time:choice.time,clientName:document.getElementById('clientName').value.trim(),clientPhone:document.getElementById('clientPhone').value.trim(),clientEmail:document.getElementById('clientEmail').value.trim(),status:'pending',created:Date.now()};if(!b.clientName||!b.clientPhone){alert('Please enter your name and phone number.');return}db.bookings.push(b);save();show('bookingFlow',false);show('startCard');alert('Booking request saved. The salon will confirm it shortly.')}if(t.id==='btnLookup'){let phone=document.getElementById('findPhone').value.trim(),found=db.bookings.filter(b=>b.clientPhone===phone);document.getElementById('lookupResults').innerHTML=found.length?found.map(b=>`<div class="opt"><b>${esc(byId(db.services,b.serviceId)?.name||'Appointment')}</b><p>${esc(b.date)} · ${esc(b.time)} · ${esc(b.status)}</p>${b.status!=='cancelled'?`<button class="btn sm ghost" data-cancel="${esc(b.id)}">Cancel booking</button>`:''}</div>`).join(''):'<p>No bookings found for that phone number.</p>'}if(t.id==='btnSaveSetup'){db.business.name=document.getElementById('setupName').value.trim()||db.business.name;db.business.tag=document.getElementById('setupTag').value.trim()||db.business.tag;db.business.currency=document.getElementById('setupCurrency').value;save()}if(t.id==='btnResetDemo'&&confirm('Reset all salon data on this device?')){db=structuredClone(defaultData);save()}if(t.id==='btnAddService')editService();if(t.dataset.editservice)editService(t.dataset.editservice);if(t.dataset.delservice&&confirm('Delete this service?')){db.services=db.services.filter(s=>s.id!==t.dataset.delservice);save()}if(t.id==='btnAddStaff')editStaff();if(t.dataset.editstaff)editStaff(t.dataset.editstaff);if(t.dataset.delstaff&&confirm('Delete this staff member?')){db.staff=db.staff.filter(s=>s.id!==t.dataset.delstaff);save()}if(t.id==='btnSaveHours'){['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{let closed=document.querySelector(`[data-closed="${d}"]`).checked;db.hours[d]=closed?null:[document.querySelector(`[data-hourday="${d}"]`).value,document.querySelector(`[data-hourend="${d}"]`).value]});save()}if(t.dataset.confirm){let b=byId(db.bookings,t.dataset.confirm);if(b)b.status='confirmed';save()}if(t.dataset.complete){let b=byId(db.bookings,t.dataset.complete);if(b)b.status='completed';save()}if(t.dataset.cancel){let b=byId(db.bookings,t.dataset.cancel);if(b)b.status='cancelled';save()}});document.getElementById('providerTabs').addEventListener('click',e=>{let t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));['bookings','services','staff','hours'].forEach(n=>show('provider'+n[0].toUpperCase()+n.slice(1),t.dataset.tab===n))});document.getElementById('filterDate').addEventListener('change',renderBookings);document.getElementById('filterStatus').addEventListener('change',renderBookings);document.getElementById('bookDate').addEventListener('change',renderSlots);document.getElementById('setupName').value=db.business.name;document.getElementById('setupTag').value=db.business.tag;document.getElementById('setupCurrency').value=db.business.currency;render();setMode('client');
</script></body></html>
